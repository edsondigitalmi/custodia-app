<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Gestão de Recebimentos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Custódia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
html, body { margin: 0; background: #fff; }
#carga { font: 20px Arial, sans-serif; text-align: center; padding: 60px 24px; color: #333; }
#carga a { color: #1d4f91; }
</style>
</head>
<body>
<div id="carga">⏳ Carregando…</div>
<script>
// Esta página só carrega o programa (que fica no Google Apps Script) e fala com ele sem mandar as contas Google do
// navegador: assim não dá mais o erro "Não foi possível abrir o arquivo" quando há contas Google logadas.
const EXEC = 'https://script.google.com/macros/s/AKfycbzwDWgSAmSZDwbDi28eMXjc6QQZrrK1rTk8RW3iqtC4MpX_lhO7wXVuqVFy6ypc4ZNnZQ/exec';

function chamar(fn, args) {
  return fetch(EXEC, { method: 'POST', credentials: 'omit', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
    .then(r => r.json())
    .then(r => { if (!r.ok) throw new Error(r.erro || 'Erro.'); return r.v; });
}
function criarRun(ok, falha) {
  const base = {
    withSuccessHandler: f => criarRun(f, falha),
    withFailureHandler: f => criarRun(ok, f)
  };
  return new Proxy(base, { get: (t, k) => {
    if (k in t) return t[k];
    return (...args) => { chamar(String(k), args).then(v => { if (ok) ok(v); }).catch(e => { if (falha) falha(e); else console.error(e); }); };
  } });
}
window.google = { script: { run: criarRun(null, null) } };

function falhou(e) {
  document.getElementById('carga').innerHTML = 'Não consegui carregar o programa agora.<br><br>' +
    '<a href="javascript:location.reload()">Tentar de novo</a><br><br>' +
    '<a href="antigo.html">Abrir do jeito antigo</a><br><br><small>' + String(e && e.message || e) + '</small>';
}

fetch(EXEC + '?app=1', { credentials: 'omit', redirect: 'follow' })
  .then(r => r.json())
  .then(d => {
    if (!d || !d.html) throw new Error('Resposta vazia.');
    const doc = new DOMParser().parseFromString(d.html, 'text/html');
    doc.head.querySelectorAll('style').forEach(s => { const n = document.createElement('style'); n.textContent = s.textContent; document.head.appendChild(n); });
    const scripts = Array.from(doc.body.querySelectorAll('script')).map(s => s.textContent);
    doc.body.querySelectorAll('script').forEach(s => s.remove());
    document.body.innerHTML = doc.body.innerHTML;
    scripts.forEach(t => { const n = document.createElement('script'); n.textContent = t; document.body.appendChild(n); });
  })
  .catch(falhou);
</script>
</body>
</html>
